name: 写真から下書き作成

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "投稿ID"
        required: true
      memo:
        description: "店名・エリア・ひとこと"
        required: false

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 日本語フォントとライブラリを入れる
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
          pip install -q -r requirements.txt

      - name: 下書き作成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          POST_ID: ${{ github.event.inputs.post_id }}
          MEMO: ${{ github.event.inputs.memo }}
        run: python photo.py

      - name: 画像を保存（公開URL化）
        run: |
          git config user.name "gourmet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A posts data
          git commit -m "photo draft ${{ github.event.inputs.post_id }}"
          git pull --rebase
          git push

      - name: LINEに送信
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          sleep 20
          python notify.py ${{ github.event.inputs.post_id }}

      - name: 失敗したらLINEに知らせる
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ 写真の下書き作成に失敗した。もう一回写真から送ってみて\"}]}"
